<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilometerregistratie Tool</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    h2 { margin-top: 0; font-size: 1.25rem; color: #0f172a; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label { font-size: 0.875rem; font-weight: 600; color: #475569; }

    input, textarea {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    .btn-gps {
      background: #059669;
      margin-bottom: 14px;
      width: 100%;
    }
    .btn-gps:hover { background: #047857; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    th { background: #f1f5f9; }

    .actions { display: flex; gap: 8px; }
    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    .status-msg {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: -6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- NIEUWE RIT INVOER -->
  <div class="card">
    <h2>Nieuwe Rit Registreren</h2>
    
    <button type="button" class="btn btn-gps" onclick="berekenViaGPS()">
      📍 GPS-Coördinaten ophalen & KM-stand berekenen via wegen
    </button>
    <div id="gpsStatus" class="status-msg"></div>

    <form id="kmForm" onsubmit="opslaanRit(event)">
      <div class="form-group">
        <label for="datum">Datum & Tijd</label>
        <input type="datetime-local" id="datum" required>
      </div>

      <div class="form-group">
        <label for="kmStand">Huidige KM Stand</label>
        <input type="number" id="kmStand" step="0.1" placeholder="bijv. 145230" required>
      </div>

      <div class="form-group">
        <label for="omschrijving">Omschrijving / Ritdoel</label>
        <input type="text" id="omschrijving" placeholder="Klantbezoek, Werkrit, etc.">
      </div>

      <button type="submit" class="btn">Rit Opslaan</button>
    </form>
  </div>

  <!-- BEWERK MODUS (Verborgen tot 'Wijzigen' wordt geklikt) -->
  <div class="card" id="editCard" style="display: none; border-color: #3b82f6; background: #eff6ff;">
    <h2>Rit Wijzigen</h2>
    <form id="editForm" onsubmit="opslaanWijziging(event)">
      <input type="hidden" id="editIndex">
      
      <div class="form-group">
        <label for="editDatum">Datum & Tijd</label>
        <input type="datetime-local" id="editDatum" required>
      </div>

      <div class="form-group">
        <label for="editKmStand">KM Stand</label>
        <input type="number" id="editKmStand" step="0.1" required>
      </div>

      <div class="form-group">
        <label for="editOmschrijving">Omschrijving</label>
        <input type="text" id="editOmschrijving">
      </div>

      <div style="display: flex; gap: 10px;">
        <button type="submit" class="btn">Wijziging opslaan</button>
        <button type="button" class="btn btn-secondary" onclick="annuleerBewerken()">Annuleren</button>
      </div>
    </form>
  </div>

  <!-- OVERZICHT RITTEN -->
  <div class="card">
    <h2>Geregistreerde Ritten</h2>
    <table>
      <thead>
        <tr>
          <th>Datum</th>
          <th>KM Stand</th>
          <th>Afstand</th>
          <th>Omschrijving</th>
          <th>Acties</th>
        </tr>
      </thead>
      <tbody id="rittenTabel"></tbody>
    </table>
  </div>
</div>

<script>
  let ritten = JSON.parse(localStorage.getItem('km_ritten') || '[]');
  let huidigeCoords = null;

  // Vul de datum standaard op HIER EN NU
  document.getElementById('datum').value = new Date().toISOString().slice(0, 16);

  function updateTabel() {
    const tbody = document.getElementById('rittenTabel');
    tbody.innerHTML = '';

    ritten.forEach((rit, index) => {
      const vorigeKm = index > 0 ? ritten[index - 1].kmStand : null;
      const ritAfstand = vorigeKm ? (rit.kmStand - vorigeKm).toFixed(1) + ' km' : '-';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(rit.datum).toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' })}</td>
        <td><strong>${rit.kmStand}</strong> km</td>
        <td>${ritAfstand}</td>
        <td>${rit.omschrijving || '-'}</td>
        <td class="actions">
          <button class="btn btn-sm btn-secondary" onclick="openBewerken(${index})">Wijzigen</button>
          <button class="btn btn-sm btn-danger" onclick="verwijderRit(${index})">X</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    localStorage.setItem('km_ritten', JSON.stringify(ritten));
  }

  async function berekenViaGPS() {
    const status = document.getElementById('gpsStatus');
    status.innerText = "GPS locatie ophalen...";

    if (!navigator.geolocation) {
      status.innerText = "Geolocation wordt niet ondersteund door je browser.";
      return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      huidigeCoords = { lat, lon };

      if (ritten.length === 0) {
        status.innerText = "GPS opgeslagen als beginpunt. Voer je eerste KM-stand handmatig in.";
        return;
      }

      const laatsteRit = ritten[ritten.length - 1];
      if (!laatsteRit.coords) {
        status.innerText = "De vorige rit bevat geen GPS-coördinaten om de afstand mee te berekenen.";
        return;
      }

      status.innerText = "Route berekenen over de weg...";

      try {
        // OSRM API call voor route over de weg
        const url = `https://router.project-osrm.org/route/v1/driving/${laatsteRit.coords.lon},${laatsteRit.coords.lat};${lon},${lat}?overview=false`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const afstandInKm = data.routes[0].distance / 1000;
          const nieuweKmStand = (parseFloat(laatsteRit.kmStand) + afstandInKm).toFixed(1);

          document.getElementById('kmStand').value = nieuweKmStand;
          status.innerText = `Route berekend over weg: +${afstandInKm.toFixed(1)} km. Nieuwe stand ingevuld!`;
        } else {
          status.innerText = "Kan geen rijroute berekenen tussen de punten.";
        }
      } catch (err) {
        status.innerText = "Fout bij berekenen van de weg-afstand.";
        console.error(err);
      }
    }, (error) => {
      status.innerText = "GPS fout: " + error.message;
    });
  }

  function opslaanRit(e) {
    e.preventDefault();
    const datum = document.getElementById('datum').value;
    const kmStand = parseFloat(document.getElementById('kmStand').value);
    const omschrijving = document.getElementById('omschrijving').value;

    ritten.push({
      datum,
      kmStand,
      omschrijving,
      coords: huidigeCoords
    });

    // Sorteren op datum
    ritten.sort((a, b) => new Date(a.datum) - new Date(b.datum));

    document.getElementById('kmForm').reset();
    document.getElementById('datum').value = new Date().toISOString().slice(0, 16);
    document.getElementById('gpsStatus').innerText = '';
    huidigeCoords = null;

    updateTabel();
  }

  function openBewerken(index) {
    const rit = ritten[index];
    document.getElementById('editIndex').value = index;
    document.getElementById('editDatum').value = rit.datum;
    document.getElementById('editKmStand').value = rit.kmStand;
    document.getElementById('editOmschrijving').value = rit.omschrijving || '';

    document.getElementById('editCard').style.display = 'block';
    window.scrollTo({ top: document.getElementById('editCard').offsetTop - 20, behavior: 'smooth' });
  }

  function opslaanWijziging(e) {
    e.preventDefault();
    const index = document.getElementById('editIndex').value;

    ritten[index].datum = document.getElementById('editDatum').value;
    ritten[index].kmStand = parseFloat(document.getElementById('editKmStand').value);
    ritten[index].omschrijving = document.getElementById('editOmschrijving').value;

    ritten.sort((a, b) => new Date(a.datum) - new Date(b.datum));

    annuleerBewerken();
    updateTabel();
  }

  function annuleerBewerken() {
    document.getElementById('editCard').style.display = 'none';
    document.getElementById('editForm').reset();
  }

  function verwijderRit(index) {
    if (confirm("Rit verwijderen?")) {
      ritten.splice(index, 1);
      updateTabel();
    }
  }

  // Eerste opbouw tabel
  updateTabel();
</script>

</body>
</html>
